name: flutter_ota_update
description: "OTA app updates from GitHub Releases. Download, verify and install new versions without an app store."

repository: https://github.com/tminus1hisham/flutter_ota_update
issue_tracker: https://github.com/tminus1hisham/flutter_ota_update/issues

version: 0.0.1

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


  plugin:
    platforms:
      android:
        package: io.github.tminus1hisham.flutter_ota_update
        pluginClass: FlutterOtaUpdatePlugin
